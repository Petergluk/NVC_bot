# NVC_bot/pyproject.toml
# version: 3.0.0
# 2026-10-30T16:30:00Z
#
# Version 3.0.0:
# - UPGRADE: Поддержка актуальной линейки моделей Gemini 3.8 / 3.6 / 3.5 / 3.1 / 3.0 / 2.5 и Gemma 4.
# - ADD: Structured Outputs (Pydantic) для ИИ-судьи модерации и универсального ННО-переводчика.

[tool.poetry]
name = "weidehanbot"
version = "3.0.0"
description = "Telegram-бот для осознанной коммуникации и ненасильственного общения (ННО / NVC)"
authors = ["WeiDeHan Team"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
python-dotenv = "^1.0"
pydantic = "^2.6"
pydantic-settings = "^2.1"
python-telegram-bot = "^21.0"
aiosqlite = "^0.20"
google-genai = "^1.0.0"
google-generativeai = ">=0.8.5, <0.9.0"

[tool.poetry.group.dev.dependencies]
black = "^24.4"
isort = "^5.13"
flake8 = "^7.0"
mypy = "^1.10"
pytest = "^8.2"
pytest-asyncio = "^0.23"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
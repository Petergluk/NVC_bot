# NVC_bot/pyproject.toml
# version: 2.0.0
# 2026-10-30T06:30:00Z
#
# Version 2.0.0:
# - UPGRADE: Добавлен современный SDK `google-genai` (с сохранением обратной совместимости).
# - FIX: В dev-зависимости добавлен `pytest-asyncio` для корректного прогона асинхронных тестов.

[tool.poetry]
name = "weidehanbot"
version = "2.0.0"
description = "Telegram-бот для осознанной коммуникации (ННО / NVC)"
authors = ["WeiDeHan Team"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
python-dotenv = "^1.0"
pydantic-settings = "^2.1"
python-telegram-bot = "^21.0"
aiosqlite = "^0.20"
google-genai = "^1.0.0"
google-generativeai = ">=0.8.5, <0.9.0"

[tool.poetry.group.dev.dependencies]
black = "^24.4"
isort = "^5.13"
flake8 = "^7.0"
mypy = "^1.10"
pytest = "^8.2"
pytest-asyncio = "^0.23"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning:google._upb._message",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# NVC_bot/pyproject.toml
# version: 1.5
# 2025-07-30T00:15:00Z
#
# Version 1.5:
# - FIX: Зависимость `google-generativeai` зафиксирована в диапазоне
#   `>=0.8.5, <0.9.0` для предотвращения автоматического обновления
#   до потенциально ломающей версии 0.9.0.
#
# Version 1.4:
# - ADD: Добавлен параметр `package-mode = false` для корректной работы `poetry install`.

[tool.poetry]
name = "weidehanbot"
version = "1.0.0"
description = "Telegram-бот для осознанной коммуникации"
authors = ["WeiDeHan Team"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
python-dotenv = "^1.0"
pydantic-settings = "^2.1"
python-telegram-bot = "^21.0"
aiosqlite = "^0.20"
google-generativeai = ">=0.8.5, <0.9.0"  # FIX: Зафиксирована версия

[tool.poetry.group.dev.dependencies]
black = "^24.4"
isort = "^5.13"
flake8 = "^7.0"
mypy = "^1.10"
pytest = "^8.2"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
filterwarnings = [
    "ignore::DeprecationWarning:google._upb._message",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
